<!-- FLEET MANAGEMENT PAGE MODULE -->
<div id="page-fleet" class="page-section">
  <!-- Sub-page header with back button -->
  <div class="subpage-header">
    <div class="d-flex align-items-center">
      <button class="subpage-back-btn">
        <i class="bi bi-arrow-left"></i> BACK
      </button>
      <div class="subpage-title-group">
        <h2>Fleet Management</h2>
        <p id="fleet-subtitle">0 active workstation(s) · 0 unused license(s)</p>
      </div>
    </div>
    <div class="subpage-actions">
      <button class="btn-outline-emerald" id="btn-add-line">
        <i class="bi bi-plus-lg"></i> Add Workstation
      </button>
      <button class="btn-outline-blue" id="btn-bulk-update" style="display:none;">
        <i class="bi bi-cloud-upload"></i> Update All Workstations
      </button>
    </div>
  </div>

  <div class="page-content-area">
    <!-- Empty state (shown by default — will switch to grid when data loads) -->
    <div id="fleet-empty" class="text-center py-5">
      <div style="width:64px;height:64px;border-radius:12px;background:#262626;border:1px solid #393939;display:flex;align-items:center;justify-content:center;margin:0 auto 16px;">
        <i class="bi bi-grid-1x2 text-slate-600" style="font-size:28px;"></i>
      </div>
      <h3 class="fw-semibold text-slate-300 mb-1" style="font-size:18px;">No Workstations Yet</h3>
      <p class="text-slate-500 mb-4 mx-auto" style="font-size:14px; max-width:24rem;">
        Click "Add Workstation" to upload a <code class="text-blue">.livis</code> license file and create your first inspection workstation.
      </p>
      <button class="btn-emerald-glow" id="btn-add-line-empty">
        <i class="bi bi-plus-lg"></i> Add Workstation
      </button>
    </div>

    <!-- Loading indicator (shown briefly while first fetch is pending) -->
    <div id="fleet-loading" class="d-flex align-items-center justify-content-center py-5 text-slate-500" style="display:none;">
      <i class="bi bi-arrow-repeat spin me-2"></i>
      <span style="font-size:14px;">Loading workstations...</span>
    </div>

    <!-- Line cards grid -->
    <div id="fleet-grid" class="row g-3" style="display:none;">
      <!-- LineCards inserted by JS -->
    </div>
  </div>
</div>
